services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:8.0
    volumes:
      - .:/workspace:cached
    network_mode: service:db
    user: vscode
    command: sleep infinity

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"